<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management Dashboard</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
        h1, h2 { color: #333; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .panel { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; min-width: 300px; }

        /* Queue Styles */
        #queue-list { list-style: none; padding: 0; }
        #queue-list li { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }

        /* Table Styles */
        .tables-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; margin-top: 10px; }
        .table-box {
            padding: 10px; text-align: center; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; font-size: 0.8em;
        }
        .table-available { background-color: #28a745; }
        .table-occupied { background-color: #dc3545; }

        /* Menu Styles */
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }

        /* Forms */
        input, button { padding: 8px; margin-top: 5px; }
        button { cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h1>Hotel Management App</h1>

    <div class="container">
        <!-- Section 1: Queue Management -->
        <div class="panel">
            <h2>Queue Management</h2>
            <div>
                <input type="text" id="custName" placeholder="Customer Name">
                <input type="number" id="groupSize" placeholder="Group Size (1-6)" min="1" max="6">
                <button onclick="joinQueue()">Join Queue</button>
            </div>
            <h3>Waiting List</h3>
            <ul id="queue-list"></ul>
            <button onclick="assignTables()" style="width:100%; margin-top:10px; background-color: #6610f2;">Assign Tables (FIFO)</button>
        </div>

        <!-- Section 2: Tables Visualization -->
        <div class="panel" style="flex: 2;">
            <h2>Tables Status</h2>
            <div id="tables-container" class="tables-grid">Loading...</div>
            <p><small>Click on an occupied table (Red) to Checkout.</small></p>
        </div>
    </div>

    <div class="container" style="margin-top: 20px;">
        <!-- Section 3: Menu -->
        <div class="panel">
            <h2>Menu</h2>
            <table id="menu-table">
                <thead><tr><th>Name</th><th>Category</th><th>Price</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = "";

        async function fetchQueue() {
            const res = await fetch(`${API_URL}/queue`);
            const data = await res.json();
            const list = document.getElementById('queue-list');
            list.innerHTML = '';
            data.forEach(c => {
                const li = document.createElement('li');
                li.textContent = `Token #${c.token}: ${c.name} (Size: ${c.group_size})`;
                list.appendChild(li);
            });
        }

        async function fetchTables() {
            const res = await fetch(`${API_URL}/tables`);
            const data = await res.json();
            const container = document.getElementById('tables-container');
            container.innerHTML = '';
            data.forEach(t => {
                const div = document.createElement('div');
                div.className = `table-box ${t.status === 'OCCUPIED' ? 'table-occupied' : 'table-available'}`;
                div.innerHTML = `T${t.id}<br><small>${t.capacity}p</small>`;
                div.title = t.status;
                if(t.status === 'OCCUPIED') {
                    div.onclick = () => checkoutTable(t.id);
                }
                container.appendChild(div);
            });
        }

        async function fetchMenu() {
            const res = await fetch(`${API_URL}/menu`);
            const data = await res.json();
            const tbody = document.querySelector('#menu-table tbody');
            tbody.innerHTML = '';
            data.forEach(m => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${m.name}</td><td>${m.category}</td><td>₹${m.price}</td>`;
                tbody.appendChild(tr);
            });
        }

        async function joinQueue() {
            const name = document.getElementById('custName').value;
            const size = document.getElementById('groupSize').value;
            if(!name || !size) return alert("Please fill details");

            await fetch(`${API_URL}/customers/join?name=${name}&group_size=${size}`, { method: 'POST' });
            document.getElementById('custName').value = '';
            document.getElementById('groupSize').value = '';
            fetchQueue();
        }

        async function assignTables() {
            const res = await fetch(`${API_URL}/tables/assign`, { method: 'POST' });
            const data = await res.json();
            alert(data.message);
            fetchQueue();
            fetchTables();
        }

        async function checkoutTable(tableId) {
            if(!confirm(`Checkout Table ${tableId}?`)) return;
            const res = await fetch(`${API_URL}/billing/${tableId}/checkout`, { method: 'POST' });
            const data = await res.json();
            alert(`${data.message}. Total Bill: ₹${data.total_bill}`);
            fetchTables();
        }

        // Initial Load
        fetchQueue();
        fetchTables();
        fetchMenu();

        // Auto Refresh every 5 seconds
        setInterval(() => {
            fetchQueue();
            fetchTables();
        }, 5000);
    </script>
</body>
</html>
